ip.hash.secret=test-secret

# External proxy config (not used in these tests, but required for context init)
external.api.key=
api.external.url=

# JWT config for tests (64 hex chars = 32 bytes for HS256)
token.secret.key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
token.expiration=86400000

# Keep unit/integration tests lightweight and self-contained
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update

# Multipart uploads (keep tiny in tests)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
reviews.media.max-total-bytes=10

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
