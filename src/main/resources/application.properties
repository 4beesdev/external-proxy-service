spring.application.name=external-proxy-service

external.api.key=${EXTERNAL_API_KEY}
api.external.url=${API_EXTERNAL_URL}

server.port=8081

# Behind reverse proxy (X-Forwarded-For / Forwarded)
server.forward-headers-strategy=framework

# PostgreSQL (set via env in prod/docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

# Multipart uploads (reviews media)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
reviews.media.max-total-bytes=104857600

# Used for HMAC hashing of client IPs (privacy)
ip.hash.secret=${IP_HASH_SECRET}

# Admin JWT auth
token.secret.key=${TOKEN_SECRET_KEY}
token.expiration=${TOKEN_EXPIRATION}
