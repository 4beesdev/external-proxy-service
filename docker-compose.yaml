services:
  server:
    build:
#      context: ../pf-backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/external_proxy
      SPRING_DATASOURCE_USERNAME: external_proxy
      SPRING_DATASOURCE_PASSWORD: external_proxy
      IP_HASH_SECRET: ${IP_HASH_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: external_proxy
      POSTGRES_USER: external_proxy
      POSTGRES_PASSWORD: external_proxy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U external_proxy -d external_proxy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
